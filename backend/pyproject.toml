[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend that turns receipt photos into structured JSON using Google Gemini"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.16.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.1",
    "python-dotenv>=1.2.2",
]
